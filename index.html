<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | MathGame</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">MathGame</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/9853637125e801e9aae48e78dbbdcfca.loader.js";
      var config = {
        dataUrl: buildUrl + "/1eff8389215e552fdd9d36584fea1664.data.unityweb",
        frameworkUrl: buildUrl + "/69eb837354ab37da0c7f2a414cfc68b6.framework.js.unityweb",
        codeUrl: buildUrl + "/ac367a1d2e10fbb4f7d485aab74dad86.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "BlindCoding",
        productName: "MathGame",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      var GAME_WIDTH = 1080;
      var GAME_HEIGHT = 1920;

      // Keep the portrait frame inside the browser window and inside fullscreen.
      // A fixed 1080x1920 canvas is taller than a desktop display and scrolls.
      function fitCanvas() {
        var availW = window.innerWidth || document.documentElement.clientWidth || GAME_WIDTH;
        var availH = window.innerHeight || document.documentElement.clientHeight || GAME_HEIGHT;
        var scale = Math.min(availW / GAME_WIDTH, availH / GAME_HEIGHT);
        var cssW = Math.max(1, Math.floor(GAME_WIDTH * scale));
        var cssH = Math.max(1, Math.floor(GAME_HEIGHT * scale));
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
        var longSide = Math.max(cssW, cssH);
        var nativeRatio = window.devicePixelRatio || 1;
        // Keep the long framebuffer side near 2048 so a large monitor does not allocate a huge buffer.
        config.devicePixelRatio = Math.min(nativeRatio, Math.max(1, 2048 / longSide));
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      window.addEventListener("resize", fitCanvas);
      document.addEventListener("fullscreenchange", fitCanvas);
      fitCanvas();

      loadingBar.style.display = "block";

      // Task.Delay on this WebGL build schedules a thread-pool timer that never
      // runs, so the hub and the duel both wait forever. The patched player
      // publishes each promise; a browser timer completes it.
      var unityInstance = null;
      var seenDelays = {};
      function pumpDelays() {
        if (!unityInstance || !unityInstance.Module || !unityInstance.Module.asm) return;
        var asm = unityInstance.Module.asm;
        if (!asm.g_delay_task) return;
        var task = asm.g_delay_task.value | 0;
        if (!task || seenDelays[task]) return;
        seenDelays[task] = true;
        var ms = asm.g_delay_ms.value | 0;
        if (ms < 0) ms = 0;
        setTimeout(function() {
          try { asm.dynCall_vii(43698, task, 0); }
          catch (err) { console.error(err); }
        }, ms);
      }
      setInterval(pumpDelays, 50);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((instance) => {
                unityInstance = instance;
                loadingBar.style.display = "none";
                fitCanvas();
                // Startup disables both backdrop images. SetHubState turns the
                // castle back on, including after the game's own init pass.
                function showHubBackdrop() {
                  unityInstance.SendMessage("BackGroundPanel", "SetHubState");
                }
                showHubBackdrop();
                setTimeout(showHubBackdrop, 1500);
                setTimeout(showHubBackdrop, 3200);
                fullscreenButton.onclick = () => {
                  if (document.fullscreenElement) document.exitFullscreen();
                  else container.requestFullscreen();
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
